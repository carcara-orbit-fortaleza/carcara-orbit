# ── Dev: hot reload, bind mounts e portas publicadas ───────────────────
# Carregado automaticamente por `docker compose up`.
services:
  db:
    ports: ["${DB_PORT:-5432}:5432"]

  api:
    build:
      target: development
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=1
    ports: ["${API_PORT:-3000}:${API_PORT:-3000}"]

  web:
    build:
      target: development
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=1
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
    ports: ["${WEB_PORT:-5173}:5173"]
