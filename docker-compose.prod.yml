# ── Prod: Traefik já existente na VPS, nginx com SPA e proxy /api ──────
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d --build
#
# Este arquivo NÃO sobe Traefik e NÃO publica 80/443: o Traefik que já atende
# essas portas na VPS é o edge. O `web` entra na rede dele (TRAEFIK_NETWORK) e
# recebe as labels do roteador do subdomínio APP_HOST. Veja docs/DEPLOY.md.
services:
  db:
    restart: always
    shm_size: 256mb
    command:
      - postgres
      - -c shared_buffers=256MB
      - -c effective_cache_size=768MB
      - -c work_mem=16MB
      - -c wal_compression=on
      - -c max_connections=100
      - -c log_min_duration_statement=3000
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-carcara} -d ${DB_NAME:-carcara}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"

  api:
    restart: always
    build:
      target: production
    environment:
      - NODE_ENV=production
    volumes:
      - api_data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:'+(process.env.PORT||3000)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=false"
    # Sem porta publicada no host: o tráfego público entra em :443 →
    # Traefik da VPS → web → /api/* → api:3000 (rede interna do Compose).

  web:
    restart: always
    build:
      target: production
      args:
        VITE_API_URL: /api
    environment:
      - SERVER_UPSTREAM=http://api:${API_PORT:-3000}
    networks:
      - app-network
      # Rede compartilhada com o Traefik que já roda na VPS.
      - traefik-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # Rede que o Traefik usa para alcançar este container (docker network ls).
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-proxy}"
      - "traefik.http.routers.carcara-orbit.rule=Host(`${APP_HOST:-app.example.com}`)"
      - "traefik.http.routers.carcara-orbit.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.carcara-orbit.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
      - "traefik.http.middlewares.carcara-orbit-secure.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.carcara-orbit-secure.headers.stsIncludeSubdomains=true"
      - "traefik.http.routers.carcara-orbit.middlewares=carcara-orbit-secure"
      - "traefik.http.services.carcara-orbit.loadbalancer.server.port=80"

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${DB_USER:-carcara}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD no .env}
      - POSTGRES_DB=${DB_NAME:-carcara}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    volumes: [postgres_backups:/backups]
    networks: [app-network]
    depends_on:
      db: { condition: service_healthy }
    labels:
      - "traefik.enable=false"

volumes:
  api_data:
  postgres_backups:

networks:
  # Criada e gerenciada pelo Traefik que já roda na VPS. O nome real vem de
  # TRAEFIK_NETWORK (padrão: traefik-proxy).
  traefik-proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-proxy}
