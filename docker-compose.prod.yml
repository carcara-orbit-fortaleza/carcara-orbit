# ── Prod: TLS com Traefik, nginx com SPA e proxy /api ──────────────────
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d --build
services:
  db:
    restart: always
    shm_size: 256mb
    command:
      - postgres
      - -c shared_buffers=256MB
      - -c effective_cache_size=768MB
      - -c work_mem=16MB
      - -c wal_compression=on
      - -c max_connections=100
      - -c log_min_duration_statement=3000
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-carcara} -d ${DB_NAME:-carcara}"]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v2.11
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/traefik/:/data/
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ADMIN_EMAIL}
      - --certificatesresolvers.le.acme.storage=/data/acme.json
    networks: [app-network]

  api:
    restart: always
    build:
      target: production
    environment:
      - NODE_ENV=production
    volumes:
      - api_data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:'+(process.env.PORT||3000)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Sem labels do Traefik: a API não é publicada no host. O tráfego
    # público entra em :443 → web nginx → /api/* → api:3000 (rede interna).

  web:
    restart: always
    build:
      target: production
      args:
        VITE_API_URL: /api
    environment:
      - SERVER_UPSTREAM=http://api:${API_PORT:-3000}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${APP_HOST:-app.example.com}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=le"
      - "traefik.http.middlewares.web-secure.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.web-secure.headers.stsIncludeSubdomains=true"
      - "traefik.http.routers.web.middlewares=web-secure"
      - "traefik.http.services.web.loadbalancer.server.port=80"

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${DB_USER:-carcara}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD no .env}
      - POSTGRES_DB=${DB_NAME:-carcara}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    volumes: [postgres_backups:/backups]
    networks: [app-network]
    depends_on:
      db: { condition: service_healthy }

volumes:
  api_data:
  postgres_backups:
